[project]
name = "agentic-bfsi-fraud-engine"
version = "0.1.0"
description = "A multi-agent AI pipeline for real-time BFSI fraud detection and simulated Hyperledger smart contract generation."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Chetan Raju" }]
keywords = ["agents", "bfsi", "fraud-detection", "hyperledger", "fintech"]
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
fraud-engine = "fraud_engine.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]
